server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────
    # Applied at server level. NOTE: nginx only inherits add_header into a
    # location if that location declares no add_header of its own, so the
    # static-asset and html locations below re-assert the headers they need.
    #
    # script-src keeps 'unsafe-inline' because the UI uses inline on* handlers
    # (a no-build vanilla-JS app). Everything else is locked down. Eliminating
    # the inline handlers would let us drop 'unsafe-inline' — tracked as
    # follow-up; it needs the event wiring moved to addEventListener.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Proxy API calls — keeps the internal API host out of client-side JS
    location /api/ {
        proxy_pass http://__API_HOST__/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve PWA (this serves the index.html document → inherits the headers above)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets. Re-assert the headers that matter for sub-resources
    # (MIME-sniffing protection + cross-origin isolation), since declaring
    # add_header here stops inheritance of the server-level set.
    location ~* \.(js|css|png|jpg|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # No cache for HTML (so updates are instant). Re-assert the full header set
    # for direct .html requests.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
