name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "meal-pwa/**"
      - "meal-api/**"
      - "pakn-scraper/**"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      pwa: ${{ steps.filter.outputs.meal-pwa }}
      api: ${{ steps.filter.outputs.meal-api }}
      scraper: ${{ steps.filter.outputs.pakn-scraper }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            meal-pwa:
              - 'meal-pwa/**'
            meal-api:
              - 'meal-api/**'
            pakn-scraper:
              - 'pakn-scraper/**'

  build:
    needs: detect
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # BUILD & PUSH meal-pwa
      # -------------------------
      - name: Build meal-pwa
        if: needs.detect.outputs.pwa == 'true'
        run: |
          docker build \
            -t localhost:5000/meal-pwa:latest \
            -f meal-pwa/Dockerfile \
            meal-pwa

          docker push localhost:5000/meal-pwa:latest

      # -------------------------
      # BUILD & PUSH meal-api
      # -------------------------
      - name: Build meal-api
        if: needs.detect.outputs.api == 'true'
        run: |
          docker build \
            -t localhost:5000/meal-api:latest \
            -f meal-api/Dockerfile \
            meal-api

          docker push localhost:5000/meal-api:latest

      # -------------------------
      # BUILD & PUSH scraper
      # -------------------------
      - name: Build pakn-scraper
        if: needs.detect.outputs.scraper == 'true'
        run: |
          docker build \
            -t localhost:5000/pakn-scraper:latest \
            -f pakn-scraper/Dockerfile \
            pakn-scraper

          docker push localhost:5000/pakn-scraper:latest